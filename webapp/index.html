<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TfL Tracker</title>

    <!-- Installed on iOS, the page extends under the translucent status bar; keep content clear of it -->
    <style>
        body {
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description"
        content="Track London Underground, DLR, Elizabeth line and Overground trains in real-time" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TfL Tracker">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- iOS icon support -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- favicon -->
    <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="shortcut icon" href="icons/favicon.ico" />

    <!-- Trunk assets -->
    <link data-trunk rel="rust" />
    <link data-trunk rel="copy-file" href="manifest.json" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-dir" href="icons" />
    <link data-trunk rel="copy-file" href="stop_points.json" />

    <!-- Tailwind CSS -->
    <link data-trunk rel="tailwind-css" href="tailwind.css" />

    <!-- PWA Init Script -->
    <script>
        // Register the service worker relative to the page so it also works from a sub-path
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.warn('ServiceWorker registration failed:', err));
            });
        }

        // Offer an "Add to Home Screen" button where the browser supports it
        let deferredInstallPrompt = null;

        function setInstallButtonVisible(visible) {
            const container = document.getElementById('install-container');
            if (container) {
                container.style.display = visible ? 'block' : 'none';
            }
        }

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            setInstallButtonVisible(true);
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            setInstallButtonVisible(false);
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('install-btn').addEventListener('click', async () => {
                if (!deferredInstallPrompt) {
                    return;
                }
                setInstallButtonVisible(false);
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
            });
        });
    </script>
</head>

<body>
    <div id="install-container" class="fixed bottom-4 right-4 z-50" style="display: none;">
        <button id="install-btn"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-lg flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Add to Home Screen
        </button>
    </div>
</body>

</html>
